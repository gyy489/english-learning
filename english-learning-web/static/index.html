<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta id="themeColor" name="theme-color" content="#f4f3ee">
    <title>每日英语</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("english-learning-theme");
        const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = savedTheme || systemTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="/static/styles.css?v=20260814-hide-translations-1">
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <button id="themeButton" class="theme-button" type="button" title="切换到暗色主题" aria-label="切换到暗色主题">
          <span id="themeIcon" aria-hidden="true">☾</span>
        </button>
        <div class="article-heading">
          <select id="daySelect" class="day-select" aria-label="选择学习天数">
            <option>读取中</option>
          </select>
          <h1 id="articleTitle">正在读取文章...</h1>
          <p id="sourceLabel" class="source-label"></p>
        </div>

        <div class="audio-panel" aria-label="音频播放器">
          <audio id="audio" preload="auto"></audio>
          <div class="audio-actions">
            <button id="backButton" class="icon-button" type="button" title="单击后退 3 秒，长按连续后退" aria-label="单击后退 3 秒，长按连续后退">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H5V3M5.4 7A8 8 0 1 1 4 14"/></svg>
            </button>
            <button id="playButton" class="play-button" type="button" title="播放或暂停" aria-label="播放或暂停">▶</button>
            <button id="forwardButton" class="icon-button" type="button" title="单击前进 3 秒，长按连续前进" aria-label="单击前进 3 秒，长按连续前进">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h4V3m-.4 4A8 8 0 1 0 20 14"/></svg>
            </button>
          </div>
          <div class="audio-timeline">
            <span id="currentTime">0:00</span>
            <input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度">
            <span id="duration">0:00</span>
          </div>
          <div class="volume-row">
            <span aria-hidden="true">音量</span>
            <input id="volume" type="range" min="0" max="1" value="0.8" step="0.05" aria-label="音量">
          </div>
        </div>
      </header>

      <nav class="learning-tabs" aria-label="学习方式">
        <button id="readingTab" class="learning-tab active" type="button" role="tab" aria-selected="true" aria-controls="readingView">阅读与听力</button>
        <button id="writingTab" class="learning-tab" type="button" role="tab" aria-selected="false" aria-controls="writingView">写作与口语</button>
      </nav>

      <div id="readingView" class="learning-view">
      <section class="content-section review-plan-section" aria-labelledby="reviewPlanHeading">
        <div class="section-heading">
          <h2 id="reviewPlanHeading">长期复习计划</h2>
          <span id="reviewPlanDay" class="count">读取中</span>
        </div>
        <div class="review-plan-stats">
          <div class="review-stat">
            <strong id="vocabularyCount">—</strong>
            <span>词库总数</span>
          </div>
          <div class="review-stat">
            <strong id="activePoolCount">—</strong>
            <span>活跃学习池</span>
          </div>
          <div class="review-stat">
            <strong id="inboxWordCount">—</strong>
            <span>等待收件箱</span>
          </div>
          <div class="review-stat">
            <strong id="dueWordCount">—</strong>
            <span>本次到期</span>
          </div>
          <div class="review-stat">
            <strong id="maintenancePoolCount">—</strong>
            <span>长期维护池</span>
          </div>
          <div class="review-stat">
            <strong id="archivedWordCount">—</strong>
            <span>已归档</span>
          </div>
        </div>
        <p id="reviewPlanMessage" class="review-plan-message">正在计算下一篇文章的复习负荷...</p>
        <p id="reviewHabitMessage" class="review-habit-message"></p>
        <div id="reviewPlanWords" class="review-plan-words" aria-label="下一篇目标词"></div>
      </section>

      <section id="reviewSection" class="content-section review-section" aria-labelledby="reviewHeading">
        <div class="section-heading">
          <h2 id="reviewHeading">本篇复习单词</h2>
          <div class="review-heading-actions">
            <span id="reviewCount" class="count"></span>
            <button id="reviewWordsToggle" class="compact-toggle" type="button" aria-controls="reviewWords" aria-expanded="false" hidden>展开</button>
          </div>
        </div>
        <div id="reviewWords" class="review-list"></div>
      </section>

      <section class="content-section" aria-labelledby="bodyHeading">
        <div class="section-heading">
          <h2 id="bodyHeading">正文</h2>
          <span id="sentenceCount" class="count"></span>
        </div>
        <div id="articleBody" class="article-body"></div>
      </section>

      <section id="todaySection" class="content-section today-section" aria-labelledby="todayHeading">
        <div class="section-heading">
          <h2 id="todayHeading">今天的生单词</h2>
          <div class="today-heading-actions">
            <span id="saveStatus" class="save-status">已保存</span>
            <button id="todayWordsToggle" class="compact-toggle" type="button" aria-controls="todayWordsList" aria-expanded="false" hidden>展开</button>
          </div>
        </div>
        <div id="todayWordsList" class="review-list"></div>
      </section>

      <footer class="page-footer">
        <p id="generateStatus" class="generate-status" role="status"></p>
        <button id="completeReadingButton" class="complete-reading-button" type="button" disabled>完成阅读，进入中译英</button>
        <textarea
          id="generateInstruction"
          class="generate-instruction"
          rows="2"
          maxlength="300"
          placeholder="可选：输入这篇文章的额外要求，例如指定话题或场景；留空则按默认方式生成"
          aria-label="下一篇文章的额外要求"
        ></textarea>
        <button id="generateButton" class="generate-button" type="button">生成下一天的内容</button>
      </footer>
      </div>

      <section id="writingView" class="learning-view writing-view" hidden aria-labelledby="writingHeading">
        <div class="content-section writing-intro">
          <div class="section-heading">
            <h2 id="writingHeading">中译英练习</h2>
            <span id="writingDayLabel" class="count"></span>
          </div>
          <p id="writingAvailability" class="writing-availability">正在读取当天练习...</p>
          <button id="writingCreateButton" class="complete-reading-button" type="button" hidden>基于本篇创建中译英</button>
        </div>

        <div id="writingContent" hidden>
          <section id="writingFocusCard" class="content-section writing-focus-card" hidden aria-labelledby="writingFocusTitle">
            <p class="writing-focus-kicker">本次只解决一个问题</p>
            <h2 id="writingFocusTitle"></h2>
            <p id="writingFocusExplanation"></p>
            <p id="writingFocusMethod" class="writing-focus-method"></p>
          </section>
          <section class="content-section writing-prompt-section">
            <div class="section-heading">
              <h2 id="writingTitle">中文题目</h2>
            </div>
            <p id="writingInstructions" class="writing-instructions"></p>
            <div id="writingTargetWords" class="review-plan-words" aria-label="建议使用的词汇"></div>
            <div class="section-heading">
              <h2 id="writingEditorHeading">逐段翻译</h2>
              <span id="writingWordCount" class="count">0 词</span>
            </div>
            <div id="writingExercise" class="writing-exercise" lang="zh-CN"></div>
            <p id="writingSyncStatus" class="writing-sync-status" role="status"></p>
            <div class="writing-submit-row">
              <label class="correction-level-label" for="correctionLevel">修正程度</label>
              <select id="correctionLevel" class="correction-level" aria-label="修正程度">
                <option value="basic">基础纠错</option>
                <option value="natural" selected>自然表达</option>
                <option value="advanced">结构提升</option>
              </select>
              <button id="writingSubmitButton" class="generate-button writing-submit-button" type="button">提交并修正</button>
            </div>
            <p id="writingStatus" class="generate-status" role="status"></p>
          </section>

          <section id="writingAttemptsSection" class="content-section writing-attempts-section" aria-labelledby="writingAttemptsHeading" hidden>
            <div class="section-heading">
              <h2 id="writingAttemptsHeading">提交记录</h2>
              <span id="writingAttemptCount" class="count"></span>
            </div>
            <div id="writingAttempts" class="writing-attempts"></div>
          </section>
        </div>
      </section>
    </main>

    <aside id="dictionaryPopover" class="dictionary-popover" hidden aria-live="polite">
      <div class="dictionary-header">
        <div>
          <strong id="dictionaryWord" class="dictionary-word"></strong>
          <span id="dictionaryPhonetic" class="dictionary-phonetic"></span>
        </div>
        <button id="dictionaryClose" class="dictionary-close" type="button" title="关闭词典" aria-label="关闭词典">×</button>
      </div>
      <div id="dictionaryLoading" class="dictionary-loading">查询中...</div>
      <div id="dictionaryContent" hidden>
        <section class="dictionary-section" aria-labelledby="dictionaryChineseHeading">
          <h3 id="dictionaryChineseHeading">中文释义</h3>
          <p id="dictionaryChinese"></p>
        </section>
        <section class="dictionary-section" aria-labelledby="dictionaryEnglishHeading">
          <h3 id="dictionaryEnglishHeading">English definition</h3>
          <p id="dictionaryEnglish"></p>
        </section>
        <span class="dictionary-source">ECDICT</span>
      </div>
    </aside>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js?v=20260814-writing-focus-1" defer></script>
  </body>
</html>
